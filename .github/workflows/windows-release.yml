name: Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-test-release:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1f # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Validate tag and version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Windows/src/CodexMeter.Windows/CodexMeter.Windows.csproj)).Project.PropertyGroup.Version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match Windows version $version"
          }
          "WINDOWS_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Restore and test
        run: |
          dotnet restore Windows/CodexMeter.Windows.sln
          dotnet format whitespace Windows/CodexMeter.Windows.sln --verify-no-changes --no-restore
          dotnet test Windows/CodexMeter.Windows.sln --configuration Release --no-restore
      - name: Package x64 and ARM64
        shell: pwsh
        run: |
          Windows/Scripts/package.ps1 -RuntimeIdentifier win-x64 -Version $env:WINDOWS_VERSION -ResetManifest
          Windows/Scripts/package.ps1 -RuntimeIdentifier win-arm64 -Version $env:WINDOWS_VERSION
      - name: Smoke test Windows tray process
        shell: pwsh
        run: |
          $process = Start-Process Windows/artifacts/publish/win-x64/CodexMeter.exe -PassThru
          Start-Sleep -Seconds 5
          if ($process.HasExited) { throw "CodexMeter exited during the Windows smoke test" }
          Stop-Process -Id $process.Id
      - name: Verify Windows package checksums
        shell: pwsh
        run: |
          foreach ($architecture in @("x64", "arm64")) {
            $archive = "Artifacts/CodexMeter-Windows-$env:WINDOWS_VERSION-$architecture.zip"
            $expected = (Get-Content "$archive.sha256").Split()[0]
            $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($expected -ne $actual) { throw "Windows $architecture package checksum mismatch" }
          }
      - name: Upload verified Windows release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CodexMeter-Windows-${{ github.ref_name }}
          path: |
            Artifacts/CodexMeter-Windows-*-x64.zip
            Artifacts/CodexMeter-Windows-*-x64.zip.sha256
            Artifacts/CodexMeter-Windows-*-arm64.zip
            Artifacts/CodexMeter-Windows-*-arm64.zip.sha256
            Artifacts/SHA256SUMS-windows.txt
          if-no-files-found: error
