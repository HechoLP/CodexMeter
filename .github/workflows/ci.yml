name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1f # v7
      - name: Swift version
        run: swift --version
      - name: Unit and integration tests
        run: swift test
      - name: Validate release and Homebrew files
        run: |
          zsh -n Scripts/*.sh
          set +e
          HOMEBREW_NO_AUTO_UPDATE=1 brew style Casks/codexmeter.rb
          style_status=$?
          brew developer off >/dev/null 2>&1 || true
          exit "$style_status"
      - name: Universal release build
        run: swift build -c release --arch arm64 --arch x86_64
      - name: Verify architectures
        run: |
          architectures=$(lipo -archs .build/apple/Products/Release/CodexMeter)
          echo "$architectures"
          grep -q arm64 <<< "$architectures"
          grep -q x86_64 <<< "$architectures"
