name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1f # v7
      - name: Swift version
        run: swift --version
      - name: Unit and integration tests
        run: swift test
      - name: Validate release scripts
        run: |
          zsh -n Scripts/*.sh Tests/Scripts/*.zsh
          for test_script in Tests/Scripts/*_tests.zsh; do
            "$test_script"
          done
      - name: Universal release build
        run: swift build -c release --arch arm64 --arch x86_64
      - name: Verify architectures
        run: |
          architectures=$(lipo -archs .build/apple/Products/Release/CodexMeter)
          echo "$architectures"
          grep -q arm64 <<< "$architectures"
          grep -q x86_64 <<< "$architectures"

  windows-build-and-test:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1f # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - name: Restore Windows solution
        run: dotnet restore Windows/CodexMeter.Windows.sln
      - name: Validate Windows formatting
        run: dotnet format Windows/CodexMeter.Windows.sln --verify-no-changes --no-restore --severity warn
      - name: Test Windows core
        run: dotnet test Windows/CodexMeter.Windows.sln --configuration Release --no-restore
      - name: Read Windows version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Windows/src/CodexMeter.Windows/CodexMeter.Windows.csproj)).Project.PropertyGroup.Version
          "WINDOWS_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Package Windows x64 preview
        shell: pwsh
        run: Windows/Scripts/package.ps1 -RuntimeIdentifier win-x64 -Version $env:WINDOWS_VERSION -ResetManifest
      - name: Smoke test Windows tray process
        shell: pwsh
        run: |
          $process = Start-Process Windows/artifacts/publish/win-x64/CodexMeter.exe -PassThru
          Start-Sleep -Seconds 5
          if ($process.HasExited) { throw "CodexMeter exited during the Windows smoke test" }
          Stop-Process -Id $process.Id
      - name: Verify Windows package checksum
        shell: pwsh
        run: |
          $archive = "Artifacts/CodexMeter-Windows-$env:WINDOWS_VERSION-x64.zip"
          $expected = (Get-Content "$archive.sha256").Split()[0]
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw "Windows package checksum mismatch" }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CodexMeter-Windows-x64
          path: |
            Artifacts/CodexMeter-Windows-*-x64.zip
            Artifacts/CodexMeter-Windows-*-x64.zip.sha256
            Artifacts/SHA256SUMS-windows.txt
          if-no-files-found: error
