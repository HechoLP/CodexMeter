name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1f # v7
      - name: Swift version
        run: swift --version
      - name: Unit and integration tests
        env:
          CODEXMETER_ACCOUNT_CAPTURE_DIR: ${{ github.workspace }}/.impeccable/review/accounts
        run: swift test
      - name: Upload synthetic account layout captures on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synthetic-account-layouts
          path: .impeccable/review/accounts/*.png
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Validate release scripts
        run: |
          zsh -n Scripts/*.sh Tests/Scripts/*.zsh
          for test_script in Tests/Scripts/*_tests.zsh; do
            "$test_script"
          done
      - name: Universal release build
        run: swift build -c release --arch arm64 --arch x86_64
      - name: Verify architectures
        run: |
          architectures=$(lipo -archs .build/apple/Products/Release/CodexMeter)
          echo "$architectures"
          grep -q arm64 <<< "$architectures"
          grep -q x86_64 <<< "$architectures"
